name = "autotask-abillity-sync"
main = "src/index.js"
compatibility_date = "2026-09-09"

# Not secrets - the exact labels of your two Autotask Company UDFs. These must
# match Autotask character for character, capitals included.
# Everything else is set with `wrangler secret put`.
[vars]
AutotaskAbillityIdUdfLabel = "aBillity Company ID"
AutotaskSyncFlagUdfLabel = "Sync with aBillity (yes or no)"
